name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    # The UI review branch currently requests source-only validation.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.txt -e .
      - name: Locate Inno Setup compiler
        if: github.head_ref != 'ui/side-panel-tabs'
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler is missing' }
      - name: Check installer compiler compatibility
        if: github.head_ref != 'ui/side-panel-tabs'
        run: python -m scripts.build_installer --compiler-preflight
      - name: Check code quality
        run: |
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check .
      - name: Check native window frame and edge hover
        run: python -m pytest tests/test_window_frame.py tests/test_progress_layout.py tests/test_example_panels.py::test_actual_hover_enter_leave_and_dialog_hold
      - name: Run GUI tests on Windows
        run: python -m pytest --maxfail=1 --junitxml=test-results.xml
      - name: Build complete Windows application folder
        if: github.head_ref != 'ui/side-panel-tabs'
        run: python -m scripts.build_windows
      - name: Verify packaged folder and relocation on Windows
        if: github.head_ref != 'ui/side-panel-tabs'
        run: python -m scripts.verify_distribution
      - name: Build Windows installer
        if: github.head_ref != 'ui/side-panel-tabs'
        run: python -m scripts.build_installer
      - name: Verify install, upgrade, optional integration and uninstall
        if: github.head_ref != 'ui/side-panel-tabs'
        run: python -m scripts.verify_installer
      - name: Prepare portable ZIP and release checksums
        if: github.head_ref != 'ui/side-panel-tabs'
        run: python -m scripts.release_assets
      - name: Record distribution size
        if: github.head_ref != 'ui/side-panel-tabs'
        run: |
          $files = Get-ChildItem 'dist/Picer' -Recurse -File
          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          $sizeReport = Get-Content 'build/distribution-size.json' -Raw | ConvertFrom-Json
          "Before: $($sizeReport.before.bytes) bytes; after: $($sizeReport.after.bytes) bytes; saved: $($sizeReport.saved_bytes) bytes"
          "Picer folder: $($files.Count) files, $([math]::Round($bytes / 1MB, 2)) MiB" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload complete Windows application folder
        if: github.head_ref != 'ui/side-panel-tabs'
        uses: actions/upload-artifact@v4
        with:
          name: Picer-windows-x64
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified release assets
        if: github.head_ref != 'ui/side-panel-tabs'
        uses: actions/upload-artifact@v4
        with:
          name: Picer-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            test-results.xml
            build/distribution-size.json
          if-no-files-found: ignore

  release:
    name: Publish verified GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Picer-release-assets
          path: release-assets
      - name: Publish installer and portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v${version}"
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title "揽映 Picer ${version}" --notes-file "docs/releases/${tag}.md"
          gh release upload "$tag" release-assets/*
          gh release edit "$tag" --draft=false
