name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.txt -e .
      - name: Check code quality
        run: |
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check .
      - name: Run GUI tests on Windows
        run: python -m pytest --junitxml=test-results.xml
      - name: Package example plugin
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path examples/negative_plugin/* -DestinationPath dist/negative-plugin.zip -Force
      - name: Build Picer.exe
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Picer --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtQuick --exclude-module PySide6.QtNetwork
          --paths src scripts/entrypoint.py
      - name: Smoke test packaged EXE on Windows
        run: |
          $exe = Join-Path $PWD 'dist/Picer.exe'
          if (-not (Test-Path $exe)) { throw 'Picer.exe was not produced' }
          $archive = Join-Path $PWD 'dist/negative-plugin.zip'
          $arguments = @('--smoke-test', '--plugin-archive', "`"$archive`"")
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(60000)) {
            taskkill /PID $process.Id /T /F
            throw 'Packaged GUI smoke test timed out'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged GUI smoke test failed: $($process.ExitCode)"
          }
      - name: Record EXE size
        run: |
          $bytes = (Get-Item 'dist/Picer.exe').Length
          "Picer.exe: $bytes bytes ($([math]::Round($bytes / 1MB, 2)) MiB)" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows x64 EXE
        uses: actions/upload-artifact@v4
        with:
          name: Picer-windows-x64
          path: |
            dist/Picer.exe
            dist/negative-plugin.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results.xml
          if-no-files-found: ignore
