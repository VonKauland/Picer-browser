name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the complete regression suite
        type: boolean
        default: false
      artifacts:
        description: Build artifacts (none, portable, or portable plus installer)
        type: choice
        options: [none, portable, all]
        default: portable

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      release_ready: ${{ steps.plan.outputs.release }}
    env:
      PICER_EVENT: ${{ github.event_name }}
      PICER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PICER_BRANCH: ${{ github.head_ref || github.ref_name }}
      PICER_FULL: ${{ inputs.full_suite || false }}
      PICER_ARTIFACTS: ${{ inputs.artifacts || 'none' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find previously validated ancestor
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            let runs = [];
            try {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'build-windows.yml', branch: process.env.PICER_BRANCH,
                status: 'success', per_page: 30
              });
              const {execFileSync} = require('child_process');
              for (const run of data.workflow_runs) {
                const message = run.head_commit?.message || '';
                if (!/^[0-9a-f]{40}$/.test(run.head_sha) || message.includes('[portable-preview]')) continue;
                if (run.head_sha === process.env.PICER_HEAD && process.env.PICER_EVENT !== 'workflow_dispatch') continue;
                try { execFileSync('git', ['merge-base', '--is-ancestor', run.head_sha, 'HEAD']); }
                catch { continue; }
                const priorBase = run.pull_requests?.[0]?.base?.sha;
                if (run.event === 'pull_request') {
                  if (!/^[0-9a-f]{40}$/.test(priorBase || '')) continue;
                  try { execFileSync('git', ['merge-base', '--is-ancestor', priorBase, 'HEAD']); }
                  catch { continue; }
                }
                const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: run.id
                });
                const validated = jobs.jobs.some(job => job.name === 'Test and build Windows x64' &&
                  job.steps?.some(step => step.conclusion === 'success' &&
                    ['Record completed validation', 'Run GUI tests on Windows'].includes(step.name)));
                if (validated) {
                  runs.push({sha: run.head_sha, message, validated: true});
                  break;
                }
              }
            } catch { core.warning('Validation history unavailable; using the event base.'); }
            const fs = require('fs');
            fs.mkdirSync('build', {recursive: true});
            fs.writeFileSync('build/validation-history.json', JSON.stringify({
              head: process.env.PICER_HEAD,
              base: context.payload.pull_request?.base.sha || context.payload.before || '',
              runs
            }));
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Plan affected validation
        id: plan
        run: python -m scripts.validate_changes --history build/validation-history.json
      - name: Install dependencies only when needed
        if: steps.plan.outputs.needs_environment == 'true'
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Run affected checks once
        if: steps.plan.outputs.needs_environment == 'true' && steps.plan.outputs.preview != 'true'
        run: python -m scripts.validate_changes --execute-plan build/validation-plan.json --junit test-results.xml
      - name: Record completed validation
        if: steps.plan.outputs.preview != 'true'
        run: Write-Output "Affected validation completed"
      - name: Build complete Windows application folder
        if: steps.plan.outputs.build == 'true'
        run: python -m scripts.build_windows
      - name: Verify packaged folder and relocation on Windows
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.preview != 'true'
        run: python -m scripts.verify_distribution
      - name: Locate Inno Setup compiler
        if: steps.plan.outputs.installer == 'true'
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler is missing' }
      - name: Build Windows installer
        if: steps.plan.outputs.installer == 'true'
        run: python -m scripts.build_installer
      - name: Verify install, upgrade, optional integration and uninstall
        if: steps.plan.outputs.installer == 'true'
        run: python -m scripts.verify_installer
      - name: Prepare portable ZIP and release checksums
        if: steps.plan.outputs.installer == 'true'
        run: python -m scripts.release_assets
      - name: Prepare requested portable ZIP
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.installer != 'true' && steps.plan.outputs.preview != 'true'
        run: python -c "from pathlib import Path; from scripts.release_assets import archive_portable; print(archive_portable(Path('dist/Picer'), Path('portable-assets')))"
      - name: Record distribution size
        if: steps.plan.outputs.build == 'true'
        run: |
          $files = Get-ChildItem 'dist/Picer' -Recurse -File
          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          "Picer folder: $($files.Count) files, $([math]::Round($bytes / 1MB, 2)) MiB" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload verified Windows application folder
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.preview != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Picer-windows-x64
          compression-level: 9
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload requested preview without running tests
        if: steps.plan.outputs.preview == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Picer-windows-x64-preview
          compression-level: 9
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified portable ZIP
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.installer != 'true' && steps.plan.outputs.preview != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Picer-portable-zip
          path: portable-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified release assets
        if: steps.plan.outputs.installer == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Picer-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation plan and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            build/validation-plan.json
            test-results.xml
            build/distribution-size.json
          if-no-files-found: ignore

  release:
    name: Publish verified GitHub Release
    needs: build
    if: needs.build.outputs.release_ready == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Picer-release-assets
          path: release-assets
      - name: Publish installer and portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v${version}"
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title "揽映 Picer ${version}" --notes-file "docs/releases/${tag}.md"
          gh release upload "$tag" release-assets/*
          gh release edit "$tag" --draft=false
